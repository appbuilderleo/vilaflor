<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Página Não Encontrada | Vila Flor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23102C36'/><path d='M16 6 C16 12 10 16 6 16 C12 16 16 20 16 26 C16 20 22 16 26 16 C20 16 16 12 16 6 Z' fill='%23B79B6A'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-ocean: #102C36;
      --warm-sand: #E8DDCA;
      --ivory: #F8F6F0;
      --muted-gold: #B79B6A;
      --text-muted: rgba(248, 246, 240, 0.7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--deep-ocean);
      color: var(--ivory);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted-gold);
      margin-bottom: 1rem;
      display: inline-block;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      margin-bottom: 1rem;
      color: var(--ivory);
    }
    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--muted-gold);
      color: var(--deep-ocean);
      font-weight: 600;
      text-decoration: none;
      padding: 0.9rem 1.8rem;
      border-radius: 4px;
      transition: all 0.25s ease;
    }
    .btn:hover {
      background-color: #c9ad7c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <span class="badge">Vila Flor · Ponta do Ouro</span>
  <h1>404 · Refúgio Não Encontrado</h1>
  <p>A página que procura não existe ou foi movida. Regresse à tranquilidade à beira-mar de Vila Flor em Ponta do Ouro, Moçambique.</p>
  <a href="/" class="btn">
    <span>Voltar para a Página Inicial</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
</body>
</html>
